<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">
  <h2>I.E. "5074 Alcides Spelucín Vega"</h2>
  <p id="gradoSeccion">Grado y sección: No identificados</p>
  <p id="docenteNombre">👨‍🏫 Docente: No identificado</p>
  <p id="horarioDocente">🕒 Horario: No especificado</p>
</div>

<div id="reader"></div>

<div class="panel">
  <img id="foto" class="foto">
  <div id="nombre" class="nombre"></div>
  <div id="estado" class="estado"></div>
  <div id="mensaje" class="mensaje"></div>
</div>

<script>
// Datos enviados por el panel institucional al abrir el escáner.
// Ejemplo: ?docente=ANA%20BETTY&grado=4&seccion=A&horario=7%3A40%20a.m.%20-%2012%3A40%20p.m.
(function () {
  const p = new URLSearchParams(window.location.search);
  const docente = (p.get('docente') || p.get('nombreDocente') || '').trim();
  const grado = (p.get('grado') || '').trim();
  const seccion = (p.get('seccion') || '').trim().toUpperCase();
  const asignacion = (p.get('gradoSeccion') || p.get('seccionAsignada') || '').trim().toUpperCase();
  const horario = (p.get('horario') || '').trim();
  const match = asignacion.match(/^([1-6])\s*([A-Z])$/);
  const g = grado || (match ? match[1] : '');
  const sec = seccion || (match ? match[2] : '');
  if (g && sec) document.getElementById('gradoSeccion').textContent = g + '.º ' + sec + ' Nivel Primaria';
  else if (asignacion) document.getElementById('gradoSeccion').textContent = 'Grado y sección: ' + asignacion;
  if (docente) document.getElementById('docenteNombre').textContent = '👨‍🏫 ' + docente;
  if (horario) document.getElementById('horarioDocente').textContent = '🕒 ' + horario;
})();
</script>
<script src="app.js"></script>

</body>
</html>
