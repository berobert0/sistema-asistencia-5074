
<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h2>I.E. "5074 Alcides Spelucín Vega"</h2>
  <p id="gradoSeccion">Grado y sección no especificados</p>
  <p id="docente">👨‍🏫 Docente no identificado</p>
  <p id="horario">🕒 Horario no especificado</p>
</div>

<div id="reader"></div>

<div class="panel">
  <img id="foto" class="foto">
  <div id="nombre" class="nombre"></div>
  <div id="estado" class="estado"></div>
  <div id="mensaje" class="mensaje"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const nombre = params.get("docente");
  const grado = params.get("grado");
  const seccion = params.get("seccion");
  const horario = params.get("horario");

  if (nombre) {
    document.getElementById("docente").textContent =
      "👨‍🏫 Prof. " + nombre;
  }

  if (grado && seccion) {
    document.getElementById("gradoSeccion").textContent =
      grado + "° " + seccion + " Nivel Primaria";
  }

  if (horario) {
    document.getElementById("horario").textContent =
      "🕒 " + horario;
  }
</script>

<script src="app.js"></script>
</body>
</html>
