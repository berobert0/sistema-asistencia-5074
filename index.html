<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner de estudiantes | I.E. 5074</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h2>I.E. "5074 Alcides Spelucín Vega"</h2>
    <p id="docenteSeccion">Grado y sección: cargando...</p>
    <p id="docenteNombre">👩‍🏫 Identificando docente...</p>
    <p>🕒 7:40 a.m. - 12:40 p.m.</p>
    <p id="autorizacion" class="auth">Comprobando autorización...</p>
  </div>
  <div id="reader"></div>
  <div class="panel" aria-live="polite">
    <img id="foto" class="foto" alt="Foto del estudiante">
    <div id="nombre" class="nombre"></div>
    <div id="estado" class="estado">ESPERANDO QR</div>
    <div id="mensaje" class="mensaje">Apunta la cámara al QR del estudiante.</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
